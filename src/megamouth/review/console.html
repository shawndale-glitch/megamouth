<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Megamouth review</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
  --accent: #1f6feb; --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e; --chip: #f0efea;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151514; --panel: #1e1e1c; --ink: #ecebe6; --muted: #a3a29b; --line: #34332f;
          --accent: #58a6ff; --ok: #3fb950; --warn: #d29922; --bad: #f85149; --chip: #2a2a27; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 20px 16px 8px; max-width: 1080px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 13px; }
nav { display: flex; gap: 4px; max-width: 1080px; margin: 12px auto 0; padding: 0 16px; border-bottom: 1px solid var(--line); }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--muted); font: inherit; cursor: pointer; }
nav button.on { color: var(--ink); border-color: var(--accent); }
main { max-width: 1080px; margin: 0 auto; padding: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
.card.done { opacity: .6; }
.about { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); }
.title { font-weight: 600; margin: 2px 0 8px; }
.claims { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
.claim { border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
.val { font-family: ui-monospace, Menlo, monospace; font-size: 13px; word-break: break-word; margin-bottom: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
.chip { background: var(--chip); border-radius: 4px; padding: 1px 6px; font-size: 12px; color: var(--muted); }
.thumb { width: 120px; height: 68px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); cursor: zoom-in; }
button.act { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
button.ghost { background: none; color: var(--accent); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
input, select, textarea { font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
textarea { width: 100%; min-height: 48px; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; padding: 1px 7px; border-radius: 10px; border: 1px solid currentColor; }
.verified { color: var(--ok); } .stale { color: var(--bad); } .reviewed { color: var(--accent); } .proposed { color: var(--muted); }
table { width: 100%; border-collapse: collapse; }
td, th { text-align: left; vertical-align: top; padding: 8px 6px; border-top: 1px solid var(--line); font-size: 14px; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
.mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.editor { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; margin-top: 8px; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s; }
.toast.on { opacity: 1; }
dialog { border: 0; padding: 0; background: none; max-width: 92vw; }
dialog img { max-width: 92vw; max-height: 86vh; border-radius: 6px; }
@media (max-width: 640px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Megamouth review</h1>
  <div class="sub" id="sub"></div>
</header>
<nav>
  <button data-tab="conflicts" class="on">Conflicts</button>
  <button data-tab="review">Review queue</button>
  <button data-tab="steps">Steps</button>
</nav>
<main id="main"></main>
<div class="toast" id="toast"></div>
<dialog id="zoom"><img id="zoomimg" alt=""></dialog>
<script>
let S = null, tab = "conflicts";
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const txt = v => v == null ? "—" : typeof v === "object" ? (Array.isArray(v) ? v.join(", ") : Object.entries(v).map(([k, x]) => `${k}: ${typeof x === "object" ? JSON.stringify(x) : x}`).join(" · ")) : String(v);
const target = t => !t ? "" : Object.entries(t).map(([k, v]) => k === "within" ? `within (${target(v)})` : `${k}=${JSON.stringify(v)}`).join(" ");

function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1800); }
async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  if (!r.ok) { toast((await r.json()).detail || "Error"); throw new Error(r.status); }
  return r.json();
}
function evidence(list) {
  return `<div class="chips">${list.map(e => e.image
      ? `<img class="thumb" src="/blob/${esc(e.image)}" alt="${esc(e.kind)} ${esc(e.locator)}" title="${esc(e.source)} ${esc(e.locator)}">`
      : `<span class="chip" title="${esc(e.id)}">${esc(e.kind)} · ${esc(e.source || "")} ${esc(e.locator || "")}</span>`).join("")}</div>`;
}

function renderConflicts() {
  const open = S.conflicts.filter(c => c.status === "open"), done = S.conflicts.filter(c => c.status !== "open");
  if (!S.conflicts.length) return `<div class="empty">No conflicts.</div>`;
  return [...open, ...done].map(c => `
    <div class="card ${c.status === "open" ? "" : "done"}">
      <div class="about">${esc(c.id)} · ${esc(c.about)}</div>
      <div class="title">${esc(c.summary)}</div>
      ${c.status === "open" ? `
        <div class="claims">${c.claims.map((cl, i) => `
          <div class="claim"><div class="val">${esc(txt(cl.value))}</div>${evidence(cl.evidence)}
            <button class="ghost" data-resolve="${esc(c.id)}" data-choice="${esc(txt(cl.value))}">This one is right</button></div>`).join("")}
        </div>
        <div class="row"><textarea placeholder="Or explain the decision (e.g. both are right: the board shows the target process)" data-note="${esc(c.id)}"></textarea></div>
        <div class="row"><button class="act" data-resolve-note="${esc(c.id)}">Resolve with note</button></div>`
      : `<div class="row"><span class="badge verified">resolved</span><span class="sub">${esc(c.resolution)} — ${esc(c.resolved_by)}</span>
          <button class="ghost" data-reopen="${esc(c.id)}">Reopen</button></div>`}
    </div>`).join("");
}

function renderReview() {
  const acc = S.accepted.length ? `<p class="sub">${S.accepted.length} item(s) accepted earlier. Accepted items stay out of the queue until you reopen them in spec/overlay.yaml.</p>` : "";
  if (!S.review.length) return acc + `<div class="empty">The review queue is empty.</div>`;
  return acc + S.review.map(r => {
    const m = r.about.match(/^([^.]+)\.(S\d+)/);
    return `<div class="card">
      <div class="about">${esc(r.id)} · ${esc(r.about)}</div>
      <div class="title">${esc(r.reason)}</div>
      <div class="row"><button class="act" data-accept="${esc(r.id)}">Accept as is</button>
        ${m ? `<button class="ghost" data-goto="${esc(m[1])}.${esc(m[2])}">Correct the step</button>` : ""}</div>
    </div>`;}).join("");
}

function editor(p, st) {
  const d = st.do || {}, t = d.target || {}, e = (st.expect || {}).target || {};
  const f = (k, v, ph) => `<input data-f="${k}" value="${esc(typeof v === "object" ? "" : v ?? "")}" placeholder="${ph}">`;
  return `<div class="editor" data-editor="${esc(p.id)}.${esc(st.id)}">
    <select data-f="action">${["open","click","fill","select","press","wait"].map(a => `<option ${a === d.action ? "selected" : ""}>${a}</option>`).join("")}</select>
    ${f("role", t.role, "role (button, link…)")}${f("name", t.name, "visible name")}${f("label", t.label, "or label")}
    ${f("value", d.value, "value to type")}
    ${f("erole", e.role, "expect: role")}${f("ename", e.name, "expect: name")}${f("etext", e.text, "expect: text")}
    <button class="act" data-save="${esc(p.id)}.${esc(st.id)}">Save correction</button></div>`;
}

function renderSteps() {
  const ver = S.verification.map(v => `<span class="badge ${v.passed ? "verified" : "stale"}">${esc(v.procedure)} [${esc(v.lang)}] ${v.passed ? "passed" : "failed at " + esc(v.failed_at)}</span> <span class="sub">${esc(v.started)}</span>`).join(" ");
  return (ver ? `<p>${ver}</p>` : `<p class="sub">No grounding runs yet: run <code>megamouth verify</code>.</p>`) +
    S.procedures.map(p => `<div class="card"><div class="row" style="margin:0"><span class="title" style="margin:0">${esc(txt(p.title))}</span><span class="badge ${p.status}">${p.status}</span></div>
      <table><tr><th>Step</th><th>Narration</th><th>Action → check</th><th class="hide-sm">Evidence</th></tr>
      ${p.steps.map(st => `<tr id="${esc(p.id)}.${esc(st.id)}"><td><b>${esc(st.id)}</b><br><span class="badge ${st.status}">${st.status}</span></td>
        <td>${esc(txt(st.say))}${st.clip ? `<div class="sub mono">${esc(st.clip)}</div>` : ""}</td>
        <td class="mono">${st.do ? esc(st.do.action + " " + target(st.do.target) + (st.do.value ? " value=" + JSON.stringify(st.do.value) : "")) : "<i>no action</i>"}<br>→ ${st.expect ? esc(target(st.expect.target)) : "<i>nothing checked</i>"}
          <div class="row"><button class="ghost" data-edit="${esc(p.id)}.${esc(st.id)}">Edit</button></div><div data-slot="${esc(p.id)}.${esc(st.id)}"></div></td>
        <td class="hide-sm">${evidence(st.evidence)}</td></tr>`).join("")}</table></div>`).join("");
}

function render() {
  const open = S.conflicts.filter(c => c.status === "open").length;
  $("#title").textContent = `Review · ${S.spec.title}`;
  $("#sub").textContent = `${S.spec.path} · ${open} open conflict(s) · ${S.review.length} to review · decisions saved to spec/overlay.yaml as ${S.reviewer}`;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  $("#main").innerHTML = tab === "conflicts" ? renderConflicts() : tab === "review" ? renderReview() : renderSteps();
}

document.addEventListener("click", async ev => {
  const b = ev.target.closest("button, img.thumb"); if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; try { localStorage.setItem("mm-tab", tab); } catch (_) {} return render(); }
  if (b.matches("img.thumb")) { $("#zoomimg").src = b.src; $("#zoom").showModal(); return; }
  if (b.dataset.resolve) { S = await api("/api/resolve", {id: b.dataset.resolve, choice: b.dataset.choice}); toast("Resolved"); return render(); }
  if (b.dataset.resolveNote) {
    const note = $(`[data-note="${b.dataset.resolveNote}"]`).value.trim();
    if (!note) return toast("Write a note first");
    S = await api("/api/resolve", {id: b.dataset.resolveNote, choice: "note", note}); toast("Resolved"); return render();
  }
  if (b.dataset.reopen) { S = await api("/api/reopen", {id: b.dataset.reopen}); return render(); }
  if (b.dataset.accept) { S = await api("/api/accept", {id: b.dataset.accept}); toast("Accepted"); return render(); }
  if (b.dataset.goto) { tab = "steps"; render(); const row = document.getElementById(b.dataset.goto); row?.scrollIntoView({block: "center"}); row?.querySelector("[data-edit]")?.click(); return; }
  if (b.dataset.edit) {
    const [pid, sid] = b.dataset.edit.split("."), p = S.procedures.find(x => x.id === pid), st = p.steps.find(x => x.id === sid);
    const slot = $(`[data-slot="${b.dataset.edit}"]`); slot.innerHTML = slot.innerHTML ? "" : editor(p, st); return;
  }
  if (b.dataset.save) {
    const [procedure, step] = b.dataset.save.split("."), ed = $(`[data-editor="${b.dataset.save}"]`), v = k => ed.querySelector(`[data-f="${k}"]`).value.trim();
    const t = {}; if (v("role")) t.role = v("role"); if (v("name")) t.name = v("name"); if (v("label")) t.label = v("label");
    const doPatch = {action: v("action")}; if (Object.keys(t).length) doPatch.target = t; if (v("value")) doPatch.value = v("value");
    const et = {}; if (v("erole")) et.role = v("erole"); if (v("ename")) et.name = v("ename"); if (v("etext")) et.text = v("etext");
    const patch = {do: doPatch}; if (Object.keys(et).length) patch.expect = {target: et};
    S = await api("/api/step", {procedure, step, patch}); toast("Saved to overlay"); return render();
  }
});
$("#zoom").addEventListener("click", () => $("#zoom").close());
try { tab = localStorage.getItem("mm-tab") || tab; } catch (_) {}
api("/api/state").then(s => { S = s; render(); });
</script>
</body>
</html>
