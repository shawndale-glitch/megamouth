name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  megamouth:
    runs-on: ubuntu-24.04
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Install
        run: uv sync --extra llm --extra sheets --extra av --extra serve
      - name: Tests
        run: uv run pytest -q
      - name: Plugin requirements
        run: uv run megamouth doctor

      # The Paydesk example end to end: four disagreeing sources → Living Spec → demoshark:1
      - name: Ingest (sources + committed grounding runs), synthesize, lower
        working-directory: examples/paydesk
        run: |
          uv run megamouth ingest inbox runs
          uv run megamouth synth
          uv run megamouth lower spec/proposed/paydesk.yaml -p approve-an-invoice
      - name: Proposed spec in git is up to date
        run: git diff --exit-code -- examples/paydesk/spec/proposed/
      - name: Missing human decisions must block lowering
        working-directory: examples/paydesk
        run: |
          mv spec/overlay.yaml /tmp/overlay.yaml
          uv run megamouth synth --id no-overlay --out /tmp/no-overlay.yaml
          mv /tmp/overlay.yaml spec/overlay.yaml
          if uv run megamouth lower /tmp/no-overlay.yaml -p approve-an-invoice --out /tmp/no-overlay-ds.yaml; then
            echo "Lowering without base_url and fixtures should have reported blockers"; exit 1
          fi

      # Prove the lowered spec with DEMOShark itself: its rules, then a real run against Paydesk
      - name: Install DEMOShark
        run: |
          git clone --depth 1 https://github.com/shawndale-glitch/demoshark.git ../demoshark
          python -m venv ../ds && ../ds/bin/pip install -q -e ../demoshark
          sudo apt-get install -y fonts-noto-core || true
          ../ds/bin/python -m playwright install --with-deps chromium
      - name: DEMOShark check (rules DS1-DS10)
        run: ../ds/bin/python -m demoshark check examples/paydesk/build/demoshark/approve-an-invoice.yaml
      - name: Grounding run - every step must end up verified
        working-directory: examples/paydesk
        env: { DEMOSHARK_PYTHON: "${{ github.workspace }}/../ds/bin/python" }
        run: |
          uv run megamouth verify | tee verify.log
          grep -q "6 step(s): 6 verified" verify.log
      - name: A changed SOP step must turn stale
        working-directory: examples/paydesk
        run: |
          sed -i 's/,Select Approve\.,/,Select Approve all.,/' inbox/paydesk-sop.csv
          uv run megamouth watch --once | tee watch.log
          grep -q "approve-an-invoice.S5\*\*: verified → stale" watch.log
          git checkout inbox/paydesk-sop.csv
      - name: Drift must fail
        run: |
          if ../ds/bin/python -m demoshark demo --spec examples/paydesk/build/demoshark/approve-an-invoice.yaml --drift --voice none --lang en --out build-drift; then
            echo "A renamed button was not detected"; exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: walkthrough
          path: |
            examples/paydesk/build/ground/out/
            examples/paydesk/runs/
            examples/paydesk/spec/proposed/paydesk.yaml
            examples/paydesk/build/demoshark/
